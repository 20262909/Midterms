<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm Examination</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color: #f4f1ea; margin: 0; padding: 0;">

    <div style="text-align: center;">
        <nav style="background-color: #333; padding: 15px;">
            <a href="index.html" style="color: white; text-decoration: none; font-weight: bold;">Home</a> |
            <a href="index_about.html" style="color: white; text-decoration: none; font-weight: bold;">About</a> |
            <a href="index_services.html" style="color: white; text-decoration: none; font-weight: bold;">Services</a> |
            <a href="index_media.html" style="color: white; text-decoration: none; font-weight: bold;">Media</a> |
            <a href="index_contact.html" style="color: white; text-decoration: none; font-weight: bold;">Contact</a>
        </nav>

        <main>
            <section id="contact_information" style="padding: 40px 0 80px 0;">
                <img src="icon_contact.jpg" alt="Contact Icon" style="border-radius: 50%; width: 150px; height: 150px; object-fit: cover;">
                <h2>Contact Information</h2>
                
                <form action="#" method="post" style="display: inline-block; text-align: left; background: #fff; padding: 20px; border-radius: 8px;">
                    <fieldset>
                        <legend>Contact Information</legend>
                        
                        <p>
                            <label for="fullname">Full Name:</label><br>
                            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                        </p>
                        
                        <p>
                            <label for="phone">Phone Number:</label><br>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                        </p>
                        
                        <p>
                            <label for="email">Email:</label><br>
                            <input type="email" id="email" name="email" placeholder="Enter your email">
                        </p>
                        
                        <p>
                            <label for="date">Date:</label><br>
                            <input type="date" id="date" name="date" required>
                        </p>

                        <p>
                            <label for="time">Time:</label><br>
                            <input type="time" id="time" name="time" required>
                        </p>
                        
                        <p>
                            <label>Payment Method:</label><br>
                            <input type="radio" id="cash" name="payment" value="Cash" checked> <label for="cash">Cash</label>
                            <input type="radio" id="card" name="payment" value="Card"> <label for="card">Card</label>
                            <input type="radio" id="ewallet" name="payment" value="E-Wallet"> <label for="ewallet">E-Wallet</label>
                        </p>
                        
                        <p>
                            <label>Extras:</label><br>
                            <input type="checkbox" id="luggage" name="extras" value="Extra luggage"> <label for="luggage">Extra luggage</label><br>
                            <input type="checkbox" id="childseat" name="extras" value="Child seat"> <label for="childseat">Child seat</label><br>
                            <input type="checkbox" id="wheelchair" name="extras" value="Wheelchair accessible"> <label for="wheelchair">Wheelchair accessible</label>
                        </p>

                        <p>
                            <button type="submit">Submit</button>
                            <button type="reset">Clear</button>
                        </p>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer style="background-color: #333; color: white; padding: 20px; position: fixed; bottom: 0; width: 100%;">
            <p style="margin: 0;">&copy; 2026 Midterm Examination by Maria Sapanlay. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
